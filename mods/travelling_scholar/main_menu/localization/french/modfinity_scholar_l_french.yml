l_french:
 modfinity_scholar.1.title: "Un érudit de passage"
 modfinity_scholar.1.desc: "Un savant voyageur vient d'arriver sur nos terres. Géographe, médecin ou astronome selon qui l'on interroge, il a parcouru bien des contrées et offre son savoir à qui voudra soutenir ses travaux. Nos conseillers sont partagés : certains y voient une chance, d'autres une coûteuse curiosité."
 modfinity_scholar.1.desc.return: "Un savant voyageur revient sur nos terres. Le souvenir de notre hospitalité s'est répandu parmi les érudits, et il offre de nouveau son savoir à qui voudra soutenir ses travaux. Nos conseillers sont partagés : certains y voient une chance, d'autres une coûteuse curiosité."
 modfinity_scholar.1.a: "Financer ses travaux."
 modfinity_scholar.1.b: "Qu'il chante les louanges de nos dirigeants."
 modfinity_scholar.1.c: "Le remercier et le laisser poursuivre sa route."
