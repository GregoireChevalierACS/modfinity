 PROMPTITUDE_LAST_QUESTION: "« quel pays a le plus d'armée ? »"
 PROMPTITUDE_LAST_ANSWER: "Je n'ai pas encore accès aux données de votre partie : je ne peux donc pas vous dire quel pays a la plus grande armée en ce moment. En général, les grandes puissances qui ont beaucoup de population et de bons revenus entretiennent les plus grosses armées, mais les effectifs changent beaucoup selon les guerres et les choix de chaque pays. Pour le savoir, ouvrez l'écran de comparaison des pays ou le classement militaire, s'il existe dans votre version, et triez par force armée. Vous pouvez aussi regarder la fiche diplomatique de vos voisins et de vos rivaux. Comparez surtout les armées qui peuvent vraiment atteindre l'Arborée, plutôt que les chiffres mondiaux."
